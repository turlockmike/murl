[build-system]
requires = ["setuptools>=61.0,<77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-curl"
version = "0.7.0"
description = "A curl-like CLI tool for interacting with Model Context Protocol (MCP) servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "turlockmike"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "click>=8.0.0",
    # mcp 2.0.0 implements MCP revision 2026-07-28. murl handles both that and
    # the 2025 era (see _negotiate_era in murl/cli.py), so the floor is 2.0.0:
    # the dual-era client code depends on 2.x APIs (the 2-value transport unpack,
    # session.discover(), snake_case result attributes).
    "mcp>=2.0.0",
    # murl/cli.py and murl/auth.py import httpx directly. Declared explicitly
    # rather than inherited from mcp: mcp 1.x depends on httpx, but mcp 2.0.0
    # switched to httpx2, so relying on the transitive dependency leaves a
    # fresh install with no httpx at all and `murl --version` raising
    # ModuleNotFoundError.
    "httpx>=0.27.0",
    "exceptiongroup>=1.0.0; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/turlockmike/murl"
Repository = "https://github.com/turlockmike/murl"
Issues = "https://github.com/turlockmike/murl/issues"

[project.optional-dependencies]
keychain = [
    "keyring>=25.0.0",
]
toon = [
    "python-toon>=0.2.0,<0.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "requests>=2.31.0",
    "keyring>=25.0.0",  # keep in sync with [keychain] extras above
    "python-toon>=0.2.0,<0.3.0",  # keep in sync with [toon] extras above
]

[project.scripts]
murl = "murl.cli:main"

[tool.setuptools]
packages = ["murl"]
