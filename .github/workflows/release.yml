name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel

    - name: Build package
      run: |
        python -m build

    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest

    steps:
    - name: Check for tap deploy key
      id: check_token
      env:
        TOKEN: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "HOMEBREW_TAP_DEPLOY_KEY not set, skipping homebrew update"
          echo "skip=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract version from tag
      if: steps.check_token.outputs.skip != 'true'
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Wait for PyPI to index
      if: steps.check_token.outputs.skip != 'true'
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        for i in $(seq 1 30); do
          if curl -sf "https://pypi.org/pypi/mcp-curl/${VERSION}/json" > /dev/null 2>&1; then
            echo "PyPI has version ${VERSION}"
            exit 0
          fi
          echo "Waiting for PyPI... (attempt $i/30)"
          sleep 10
        done
        echo "::error::Timed out waiting for PyPI"
        exit 1

    - name: Checkout murl (formula generator)
      if: steps.check_token.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        path: murl-src

    - name: Checkout homebrew tap
      if: steps.check_token.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        repository: turlockmike/homebrew-murl
        # Write-enabled deploy key on homebrew-murl only; deploy keys do not expire.
        ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        path: tap

    - name: Install uv
      if: steps.check_token.outputs.skip != 'true'
      uses: astral-sh/setup-uv@v6

    - name: Regenerate formula (url, sha256 and every resource)
      if: steps.check_token.outputs.skip != 'true'
      run: |
        # Rewrites the whole file from PyPI. A blanket sed over url/sha256 lines used to
        # overwrite every resource block with the main sdist (fixed by hand in tap 2f3fdab).
        python3 murl-src/scripts/update_homebrew_formula.py "${{ steps.get_version.outputs.VERSION }}" tap/Formula/murl.rb --verify

    - name: Commit and push
      if: steps.check_token.outputs.skip != 'true'
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        cd tap
        git add Formula/murl.rb
        git diff --cached --quiet && { echo "formula already up to date"; exit 0; }
        git commit -m "Update murl to ${VERSION}"
        git push
